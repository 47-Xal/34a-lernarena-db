      "text": "(1) Die Sachkundeprüfung ist in einen mündlichen und einen schriftlichen Teil zu gliedern.\n\n(2) Im mündlichen Prüfungsteil können gleichzeitig bis zu fünf Prüflinge geprüft werden; er soll für jeden Prüfling etwa 15 Minuten dauern. Im mündlichen Prüfungsteil ist ein Schwerpunkt auf die in § 7 Nummer 1 und 6 genannten Gebiete zu legen.\n\n(3) Der schriftliche Teil der Prüfung kann mit Hilfe unterschiedlicher Medien durchgeführt werden.\n\n(4) Die Leistung des Prüflings ist von dem Prüfungsausschuss mit bestanden oder nicht bestanden zu bewerten. Die Prüfung ist bestanden, wenn die Leistungen des Prüflings im schriftlichen Teil und im mündlichen Teil der Prüfung jeweils mindestens mit ausreichend bewertet wurden.",

    {
      "id": "BEW17",
      "citation": "§ 17 BewachV",
      "title": "Dienstanweisung",
      "text": "(1) Der Gewerbetreibende hat den Wachdienst durch eine Dienstanweisung nach Maßgabe der Sätze 2 und 3 zu regeln. Die Dienstanweisung muss den Hinweis enthalten, dass die Wachperson nicht die Eigenschaft und die Befugnisse eines Polizeivollzugsbeamten, oder eines sonstigen Bediensteten einer Behörde besitzt. Die Dienstanweisung muss ferner bestimmen, dass die Wachperson während des Dienstes nur mit Zustimmung des Gewerbetreibenden eine Schusswaffe, Hieb- und Stoßwaffen sowie Reizstoffsprühgeräte führen darf und jeden Gebrauch dieser Waffen unverzüglich der zuständigen Polizeidienststelle und dem Gewerbetreibenden anzuzeigen hat.\n\n(2) Der Gewerbetreibende hat der Wachperson vor der ersten Aufnahme der Bewachungstätigkeit einen Abdruck der Dienstanweisung gegen Empfangsbescheinigung auszuhändigen.\n\n(3) Der Gewerbetreibende hat die in seinem Gewerbebetrieb beschäftigten Personen vor der ersten Aufnahme der Bewachungstätigkeit schriftlich zu verpflichten, auch nach ihrem Ausscheiden Geschäfts- und Betriebsgeheimnisse Dritter, die ihnen in Ausübung des Dienstes bekannt geworden sind, nicht unbefugt zu offenbaren.",
      "mnemonic": "Keine Polizei – Waffen nur mit Zustimmung – Gebrauch melden – Abdruck gegen Empfang – Geheimnisse wahren.",
      "url": "https://www.gesetze-im-internet.de/bewachv_2019/__17.html",
      "priority": "A – wortgenau zuerst"
    },
    {
      "id": "BEW18",
      "citation": "§ 18 Abs. 1 bis 3 BewachV",
      "title": "Ausweis und Kennzeichnung",
      "text": "(1) Der Gewerbetreibende hat der Wachperson spätestens vor der ersten Aufnahme der Bewachungstätigkeit einen Ausweis nach Maßgabe der Sätze 2 und 3 auszustellen. Der Ausweis muss enthalten: 1. Familienname und Vornamen der Wachperson, 2. Namen und Anschrift des Gewerbetreibenden, 3. Bezeichnung und Anschrift des Gewerbebetriebs, sofern diese abweichen von Namen oder Anschrift des Gewerbetreibenden nach Nummer 2, 4. Unterschriften der Wachperson sowie des Gewerbetreibenden, seines Vertreters oder seines Bevollmächtigten, 5. Bewacherregisteridentifikationsnummern der Wachperson und des Bewachungsunternehmens. Der Ausweis muss so beschaffen sein, dass er sich von amtlichen Ausweisen deutlich unterscheidet.\n\n(2) Jede Wachperson ist verpflichtet, den Ausweis in Verbindung mit dem im Bewacherregister angegebenen Ausweis- oder Identifizierungsdokument während des Wachdienstes mitzuführen und auf Verlangen den Beauftragten der Vollzugsbehörden, insbesondere Ordnungsämter, Polizei- oder Zollbehörden, vorzuzeigen.\n\n(3) Jede Wachperson, die Tätigkeiten nach § 34a Absatz 1a Satz 2 Nummer 1 und 3 bis 5 der Gewerbeordnung ausübt, hat während dieser Tätigkeiten sichtbar ein Schild mit ihrem Namen oder einer Kennnummer sowie der Bezeichnung des Gewerbebetriebs zu tragen. In den Fällen des § 34a Absatz 1a Satz 2 Nummer 4 und 5 der Gewerbeordnung gilt das auch für jede Wachperson in nicht leitender Funktion. Der Gewerbetreibende hat der Wachperson zu diesem Zweck spätestens vor der ersten Aufnahme der Bewachungstätigkeit ein entsprechendes Schild auszustellen.",
      "mnemonic": "Ausweis: Person – Unternehmer – ggf. Betrieb – Unterschriften – 2 IDs; im Dienst mitführen + behördlich zeigen; Schild bei 1 und 3–5.",
      "url": "https://www.gesetze-im-internet.de/bewachv_2019/__18.html",
      "priority": "A – wortgenau zuerst"
    },

      "id": "BEW19",
      "citation": "§ 19 BewachV",
      "title": "Dienstkleidung",
      "text": "(1) Bestimmt der Gewerbetreibende für seine Wachpersonen eine Dienstkleidung, so hat er dafür zu sorgen, dass sie sich von Uniformen der Angehörigen von Streitkräften oder behördlichen Vollzugsorganen deutlich unterscheiden und dass keine Abzeichen verwendet werden, die Amtsabzeichen zum Verwechseln ähnlich sind.\n\n(2) Jede Wachperson, die befriedetes Besitztum in Ausübung ihres Dienstes betreten soll, muss eine Dienstkleidung tragen. Satz 1 gilt entsprechend für Gewerbetreibende, die selbst als Wachperson tätig werden.",

      "title": "Waffen und Umgang",
      "text": "(2) Waffen sind\n1. Schusswaffen oder ihnen gleichgestellte Gegenstände und\n2. tragbare Gegenstände,\na) die ihrem Wesen nach dazu bestimmt sind, die Angriffs- oder Abwehrfähigkeit von Menschen zu beseitigen oder herabzusetzen, insbesondere Hieb- und Stoßwaffen;\nb) die, ohne dazu bestimmt zu sein, insbesondere wegen ihrer Beschaffenheit, Handhabung oder Wirkungsweise geeignet sind, die Angriffs- oder Abwehrfähigkeit von Menschen zu beseitigen oder herabzusetzen, und die in diesem Gesetz genannt sind.\n\n(3) Umgang mit einer Waffe oder Munition hat, wer diese erwirbt, besitzt, überlässt, führt, verbringt, mitnimmt, damit schießt, herstellt, bearbeitet, instand setzt oder damit Handel treibt. Umgang mit einer Schusswaffe hat auch, wer diese unbrauchbar macht.",

<script>
const home=document.getElementById('home'),lessons=document.getElementById('lessons'),quiz=document.getElementById('quiz'),laws=document.getElementById('laws'),mistakes=document.getElementById('mistakes'),leaderboard=document.getElementById('leaderboard'),sources=document.getElementById('sources'),lessonBody=document.getElementById('lessonBody'),lessonDlg=document.getElementById('lessonDlg'),xp=document.getElementById('xp'),correct=document.getElementById('correct'),streak=document.getElementById('streak'),wrongCount=document.getElementById('wrongCount');

const DATA=JSON.parse(document.getElementById('DATA').textContent); const Q=DATA.questions,L=DATA.lessons,LAWS=DATA.laws;
const KEY='a34_state_v2'; let state; try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null} state=state||{xp:0,correct:0,wrong:0,streak:0,mistakes:{},seen:{},board:[],name:'Spieler'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}updateStats()} function updateStats(){xp.textContent=state.xp;correct.textContent=state.correct;streak.textContent=state.streak;wrongCount.textContent=Object.keys(state.mistakes).length}
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===v)); if(v==='lessons')renderLessons(); if(v==='quiz')renderQuizSetup(); if(v==='laws')renderLaws(); if(v==='mistakes')renderMistakes(); if(v==='leaderboard')renderBoard(); if(v==='sources')renderSources()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.view));
function renderHome(){home.innerHTML=`<div class="hero"><div class="big">Dein §34a-Lernspiel ist bereit.</div><p class="muted">${Q.length} Fragen · ${L.length} Lektionen · ${LAWS.length} Wortlaut-Bausteine · lokale Bestenliste</p><div class="row"><button class="btn" onclick="show('lessons')">📚 Lektionen starten</button><button class="btn gold" onclick="quickQuiz(20)">⚡ 20er Quiz</button><button class="btn secondary" onclick="show('laws')">⚖️ Gesetzestrainer</button></div></div><div class="grid"><div class="card"><div class="kpi">${Q.length}</div><div>Fragen in der Bank</div><p class="muted mini">Originale Frage-Antwort-Blöcke + sichere Lückentextvarianten + amtlicher Wortlaut.</p></div><div class="card"><div class="kpi">7</div><div>offizielle Sachgebiete</div><p class="muted mini">Genau nach BewachV § 7 / Anlage 2 gegliedert.</p></div><div class="card"><div class="kpi">R + M</div><div>mündlicher Schwerpunkt</div><p class="muted mini">Recht der öffentlichen Sicherheit/Gewerberecht + Umgang mit Menschen.</p></div><div class="card"><div class="kpi">2026</div><div>Rechtsfallen geprüft</div><p class="muted mini">Korrekturhinweise für alte Lernzettel, z.B. §127-StPO-Minutenregel und Verbrechen/Vergehen.</p></div></div>`}
function renderLessons(){let cards=L.map(x=>`<div class="card lesson" onclick="openLesson('${x.id}')"><span class="tag">${esc(x.exam)}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.summary)}</p></div>`).join('');lessons.innerHTML=`<div class="row"><h2 style="flex:1">Lektionen</h2><input class="search" id="lessonSearch" placeholder="Lektionen durchsuchen …" oninput="filterLessons(this.value)"></div><div id="lessonGrid" class="grid">${cards}</div>`}
function filterLessons(v){v=v.toLowerCase();document.querySelectorAll('#lessonGrid .lesson').forEach((el,i)=>el.style.display=(L[i].title+' '+L[i].summary+' '+L[i].points.join(' ')).toLowerCase().includes(v)?'':'none')}
function openLesson(id){let x=L.find(z=>z.id===id);lessonBody.innerHTML=`<span class="tag">Sachgebiet ${esc(x.exam)}</span><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p><h3>Kernpunkte</h3><ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><h3>Eselsbrücken</h3><ul>${x.mnemonics.map(p=>`<li>🧠 ${esc(p)}</li>`).join('')}</ul><div class="source">Quellen: ${x.sources.map(esc).join(' · ')}</div><div class="row" style="margin-top:15px"><button class="btn" onclick="startCategory('${esc(x.title)}')">Fragen dazu üben</button></div>`;lessonDlg.showModal()}
let session=[];let qi=0;let sessionScore=0;let mcMode=false;
function renderQuizSetup(){let cats=[...new Set(Q.filter(x=>x.category!=='Gesetz wortgenau').map(x=>x.category))].sort();quiz.innerHTML=`<h2>Quiz</h2><div class="card"><div class="row"><label>Kategorie <select id="qcat"><option value="ALL">Alle</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Fragen <select id="qcount"><option>10</option><option selected>20</option><option>50</option><option>100</option></select></label><label>Modus <select id="qmode"><option value="oral">Mündlich / selbst bewerten</option><option value="mc">Multiple Choice</option></select></label><button class="btn" onclick="startQuiz()">Start</button></div><p class="muted mini">Multiple Choice wird aus der vorhandenen Antwortbank erzeugt. Der mündliche Modus ist für die echte IHK-Situation besonders nützlich.</p></div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(cat=null,count=null){let c=cat||(document.getElementById('qcat')?.value||'ALL');let n=+(count||(document.getElementById('qcount')?.value||20));mcMode=(document.getElementById('qmode')?.value==='mc');let pool=Q.filter(x=>x.type!=='law'&&x.type!=='law-identify'&&(c==='ALL'||x.category===c));session=shuffle(pool).slice(0,Math.min(n,pool.length));qi=0;sessionScore=0;renderQuestion()}
function quickQuiz(n){show('quiz');setTimeout(()=>{document.getElementById('qcount').value=String(n);startQuiz('ALL',n)},0)}
function startCategory(title){lessonDlg.close();show('quiz');let map={};let target= title.includes('Datenschutz')?'Datenschutz':title.includes('Waffen')?'Waffenrecht':title.includes('DGUV')?'UVV & Arbeitsschutz':title.includes('Kommunikation')||title.includes('Konflikt')||title.includes('Wahrnehmung')?'Umgang mit Menschen':title.includes('Mechanische')||title.includes('Elektronische')?'Sicherheitstechnik':title.includes('Brand')?'Brandschutz':title.includes('Groß')?'Großveranstaltungen':title.includes('Strafrecht')||title.includes('StPO')?'Strafrecht & StPO':title.includes('BGB')||title.includes('Notwehr')||title.includes('Notstände')?'BGB & Jedermannsrechte':title.includes('Bewach')||title.includes('34a')?'Gewerberecht & BewachV':'Öffentliches Recht';startQuiz(target,20)}
function renderQuestion(){if(qi>=session.length){finishQuiz();return}let x=session[qi];let pct=Math.round(qi/session.length*100);let body=`<div class="progress"><div style="width:${pct}%"></div></div><p class="muted">Frage ${qi+1}/${session.length} · ${esc(x.category)} · Schwierigkeit ${x.difficulty||2}/4</p><div class="question">${esc(x.q)}</div>`;if(mcMode && x.type==='direct' && x.a.length<260){let candidates=Q.filter(z=>z.id!==x.id&&z.type==='direct'&&z.a.length<260&&z.a.length>5);let distract=shuffle(candidates.filter(z=>z.category!==x.category)).slice(0,3).map(z=>z.a);let opts=shuffle([x.a,...distract]);body+=`<div id="choices">${opts.map(o=>`<button class="choice" data-correct="${o===x.a?'1':'0'}" onclick="pickChoice(this,'${x.id}')">${esc(o)}</button>`).join('')}</div>`}else{body+=`<div id="reveal"><button class="btn" onclick="revealAnswer()">Antwort anzeigen</button></div>`}body+=`<div class="source">Quelle: ${esc(x.source||'')} ${x.page?'· Seite '+x.page:''}</div>`;quiz.innerHTML=`<h2>Quiz läuft</h2><div class="card">${body}</div>`}
function revealAnswer(){let x=session[qi];document.getElementById('reveal').innerHTML=`<div class="answer">${esc(x.a)}</div>${x.current_note?`<div class="note" style="margin-top:10px">⚠ ${esc(x.current_note)}</div>`:''}<div class="row" style="margin-top:14px"><button class="btn good" onclick="rate(true)">Gewusst</button><button class="btn bad" onclick="rate(false)">Nicht gewusst</button></div>`}
function rate(ok){let x=session[qi];state.seen[x.id]=(state.seen[x.id]||0)+1;if(ok){state.correct++;state.streak++;state.xp+=10+(x.difficulty||2)*2;delete state.mistakes[x.id];sessionScore++}else{state.wrong++;state.streak=0;state.mistakes[x.id]=(state.mistakes[x.id]||0)+1;state.xp=Math.max(0,state.xp-2)}save();qi++;renderQuestion()}
function pickChoice(el,id){let buttons=[...document.querySelectorAll('.choice')];if(buttons.some(b=>b.disabled))return;let ok=el.dataset.correct==='1';buttons.forEach(b=>{b.disabled=true;if(b.dataset.correct==='1')b.classList.add('correct')});if(!ok)el.classList.add('wrong');setTimeout(()=>rate(ok),850)}
function finishQuiz(){let pct=session.length?Math.round(sessionScore/session.length*100):0;let name=state.name||'Spieler';state.board.push({name,score:sessionScore,total:session.length,pct,date:new Date().toLocaleString('de-DE')});state.board=state.board.sort((a,b)=>b.pct-a.pct||b.score-a.score).slice(0,30);save();quiz.innerHTML=`<h2>Ergebnis</h2><div class="card"><div class="big">${sessionScore}/${session.length} · ${pct}%</div><p>${pct>=80?'Stark – jetzt Fehler gezielt nacharbeiten.':pct>=60?'Solide Basis – Fehlertraining lohnt sich.':'Noch Lücken – erst Lektionen, dann nochmal.'}</p><div class="row"><button class="btn" onclick="renderQuizSetup()">Neues Quiz</button><button class="btn secondary" onclick="show('mistakes')">Fehlertraining</button></div></div>`}
let currentLaw=null;
function renderLaws(){laws.innerHTML=`<h2>Gesetze wortgenau</h2><div class="card"><p>Wähle einen Wortlaut. Der Trainer bewertet <b>exakte Form</b> (Groß-/Kleinschreibung und Satzzeichen, nur Leerraum normalisiert) und zusätzlich die <b>Worttreue</b>.</p><div class="row"><select id="lawSel" onchange="selectLaw(this.value)">${LAWS.map((l,i)=>`<option value="${i}">${esc(l.citation)} – ${esc(l.title)}</option>`).join('')}</select><button class="btn secondary" onclick="lawHint()">Eselsbrücke</button></div></div><div id="lawArea"></div>`;selectLaw(0)}
function selectLaw(i){currentLaw=LAWS[+i];document.getElementById('lawArea').innerHTML=`<div class="card"><h3>${esc(currentLaw.citation)} – ${esc(currentLaw.title)}</h3><textarea id="lawInput" placeholder="Wortlaut aus dem Kopf eintippen …"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="checkLaw()">Prüfen</button><button class="btn secondary" onclick="showLawText()">Wortlaut anzeigen</button></div><div id="lawResult"></div></div>`}
function nspace(s){return s.replace(/\s+/g,' ').trim()}function tokens(s){return nspace(s.toLowerCase().replace(/[^a-zäöüß0-9§]+/g,' ')).split(' ').filter(Boolean)}
function checkLaw(){let target=nspace(currentLaw.text),got=nspace(document.getElementById('lawInput').value);let exact=target===got;let a=tokens(target),b=tokens(got);let common=0,used=new Array(b.length).fill(false);a.forEach(w=>{let j=b.findIndex((x,i)=>!used[i]&&x===w);if(j>=0){used[j]=true;common++}});let acc=Math.round(100*common/Math.max(1,a.length));document.getElementById('lawResult').innerHTML=`<div class="card"><b class="${exact?'scoregood':'scorebad'}">${exact?'100 % exakt':'Noch nicht exakt'}</b> · Worttreue ca. <b>${acc}%</b><div class="note" style="margin-top:10px">🧠 ${esc(currentLaw.mnemonic)}</div></div>`;if(exact){state.xp+=30;state.correct++;state.streak++;save()}}
function showLawText(){document.getElementById('lawResult').innerHTML=`<div class="lawtext">${esc(currentLaw.text)}</div><div class="note" style="margin-top:10px">🧠 ${esc(currentLaw.mnemonic)}</div>`}function lawHint(){alert(currentLaw?.mnemonic||'')}
function renderMistakes(){let ids=Object.keys(state.mistakes).sort((a,b)=>state.mistakes[b]-state.mistakes[a]);let arr=ids.map(id=>Q.find(x=>x.id===id)).filter(Boolean);mistakes.innerHTML=`<h2>Fehlertraining</h2>${arr.length?`<div class="card"><p>${arr.length} offene Fehler.</p><button class="btn" onclick="startMistakeQuiz()">Fehler jetzt üben</button></div><div class="grid">${arr.slice(0,30).map(x=>`<div class="card"><span class="tag">${esc(x.category)}</span><b>${esc(x.q.slice(0,150))}</b><p class="muted mini">Fehler: ${state.mistakes[x.id]}</p></div>`).join('')}</div>`:`<div class="card">Noch keine offenen Fehler. 🎉</div>`}`}
function startMistakeQuiz(){let arr=Object.keys(state.mistakes).map(id=>Q.find(x=>x.id===id)).filter(Boolean);show('quiz');session=shuffle(arr);qi=0;sessionScore=0;mcMode=false;renderQuestion()}
function renderBoard(){leaderboard.innerHTML=`<h2>Lokale Bestenliste</h2><div class="card"><div class="row"><input id="playerName" value="${esc(state.name||'Spieler')}" placeholder="Name"><button class="btn" onclick="setName()">Name speichern</button><button class="btn bad" onclick="resetProgress()">Fortschritt löschen</button></div><p class="muted mini">Diese Bestenliste liegt nur in deinem Browser (localStorage). Online-Accounts/Server können wir später ergänzen.</p></div><div class="card"><table><thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th><th>Datum</th></tr></thead><tbody>${state.board.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}/${r.total}</td><td>${r.pct}%</td><td>${esc(r.date)}</td></tr>`).join('')||'<tr><td colspan="5">Noch kein Quiz abgeschlossen.</td></tr>'}</tbody></table></div>`}
function setName(){state.name=document.getElementById('playerName').value.trim()||'Spieler';save();renderBoard()}function resetProgress(){if(confirm('Wirklich XP, Fehler und Bestenliste löschen?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}
function renderSources(){let unread=DATA.manifest.filter(x=>x.status.includes('unreadable'));sources.innerHTML=`<h2>Quellen & 2026-Korrekturen</h2><div class="card"><h3>Aktuelle offizielle Ergänzungen</h3><p>Die sieben Sachgebiete richten sich nach BewachV § 7/Anlage 2. Die mündliche Prüfung fokussiert nach § 11 BewachV besonders Nr. 1 (Recht/Gewerberecht) und Nr. 6 (Umgang mit Menschen).</p><p class="muted">Zwei hochgeladene Dateien waren technisch keine lesbaren PDF-Bytes und konnten weder lokal noch im Datei-Parser gelesen werden: ${unread.map(x=>esc(x.name)).join(', ')||'keine'}.</p></div><div class="card"><h3>Wichtige Korrekturen gegenüber älteren Unterlagen</h3>${DATA.corrections.map(c=>`<div style="margin:14px 0"><b>${esc(c.topic)}</b><div class="muted mini">Unterlage: ${esc(c.material)}</div><div>✅ 2026: ${esc(c.current)}</div></div>`).join('')}</div><div class="card"><h3>Quellenmanifest</h3><p>${DATA.manifest.length} Einträge (inkl. ZIP und inneren PDFs).</p><table><thead><tr><th>Datei</th><th>Seiten</th><th>Status</th></tr></thead><tbody>${DATA.manifest.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.pages??'–'}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>`}
try{renderHome();updateStats();}catch(e){console.error(e);home.innerHTML='<div class="card"><h2>Startfehler</h2><p>'+esc(e.message||String(e))+'</p><p class="muted">Bitte diese Datei lokal in Chrome, Edge oder Firefox öffnen.</p></div>';}

</script></body></html>
